<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
html,body,x-dc,x-dc *,.sc-host,.sc-host *,button,input,textarea,select,option{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',Inter,'Segoe UI',sans-serif !important}
@keyframes sp-spin{to{transform:rotate(360deg)}}
.sp-spin{animation:sp-spin .8s linear infinite}
.sp-input::placeholder{color:rgba(255,255,255,0.7)}
.sp-input:focus{outline:none;border-color:#ffffff !important;background:rgba(255,255,255,0.28) !important;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.sp-btn:focus-visible,.sp-link:focus-visible,.sp-eye:focus-visible{outline:2px solid #ffffff;outline-offset:2px}
</style>
</helmet>
<div style="position:relative;width:1440px;height:960px;overflow:hidden;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#b9d6f8 0%,#4d92e0 48%,#0a4a94 100%);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',Inter,'Segoe UI',sans-serif;color:#ffffff">

<svg aria-hidden="true" width="1440" height="960" viewBox="0 0 1440 960" style="position:absolute;left:0;top:0">
<defs>
<radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</radialGradient>
</defs>
<circle cx="260" cy="120" r="520" fill="url(#bgGlow)"/>
<circle cx="720" cy="480" r="620" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>
<circle cx="720" cy="480" r="780" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
<circle cx="720" cy="480" r="940" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
</svg>

<div style="position:relative;display:flex;width:1240px;height:760px;box-sizing:border-box;border-radius:44px;background:linear-gradient(160deg,rgba(40,100,190,0.34),rgba(20,70,150,0.3));border:1px solid rgba(255,255,255,0.4);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 0 6px rgba(255,255,255,0.92),0 50px 120px rgba(3,30,70,0.38)">

<div style="flex:1;min-width:0;display:flex;flex-direction:column;padding:36px 40px;box-sizing:border-box">

<div style="display:flex;align-items:center;gap:12px">
<div style="width:40px;height:40px;border-radius:12px;background:#ffffff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(10,102,194,0.3)">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24"><polygon points="12,3 21,21 12,21" fill="#0a66c2"/><polygon points="12,3 12,21 3,21" fill="#0a66c2" fill-opacity="0.55"/></svg>
</div>
<div>
<div style="font-size:20px;font-weight:700;letter-spacing:0.02em;line-height:1.1;color:#ffffff">SPECTR</div>
<div style="margin-top:2px;font-size:12px;color:rgba(255,255,255,0.88)">Content Transformation Engine</div>
</div>
</div>

<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center">
<div style="width:368px">

<div style="text-align:center">
<h1 style="margin:0;font-size:34px;font-weight:300;letter-spacing:-0.02em;color:#ffffff">{{ title }}</h1>
<p style="margin:8px 0 0;font-size:15px;color:rgba(255,255,255,0.88)">{{ subtitle }}</p>
</div>

<div style="margin-top:28px;display:flex;flex-direction:column;gap:16px">

<sc-if value="{{ isSignup }}" hint-placeholder-val="{{ true }}">
<div>
<label for="name" style="display:block;margin-bottom:8px;font-size:13px;font-weight:600;color:#ffffff">Full Name</label>
<input class="sp-input" id="name" type="text" placeholder="Your full name" disabled="{{ isLoading }}" style="width:100%;height:48px;box-sizing:border-box;padding:0 16px;border-radius:12px;border:1px solid transparent;background:rgba(255,255,255,0.18);font-size:15px;font-family:inherit;color:#ffffff">
</div>
</sc-if>

<div>
<label for="email" style="display:block;margin-bottom:8px;font-size:13px;font-weight:600;color:#ffffff">Email</label>
<input class="sp-input" id="email" type="email" value="alex@brightside.co" disabled="{{ isLoading }}" style="{{ emailStyle }}">
</div>

<div>
<label for="pw" style="display:block;margin-bottom:8px;font-size:13px;font-weight:600;color:#ffffff">Password</label>
<div style="position:relative">
<input class="sp-input" id="pw" type="{{ pwType }}" value="password1" disabled="{{ isLoading }}" style="{{ pwStyle }}">
<button class="sp-eye" type="button" aria-label="Show or hide password" onClick="{{ togglePw }}" style="position:absolute;right:8px;top:6px;width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:rgba(255,255,255,0.88);cursor:pointer;display:flex;align-items:center;justify-content:center">
<sc-if value="{{ showPw }}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
</sc-if>
<sc-if value="{{ hidePw }}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4"/><path d="M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
</sc-if>
</button>
</div>
</div>

<sc-if value="{{ isSignup }}" hint-placeholder-val="{{ true }}">
<div>
<label for="pw2" style="display:block;margin-bottom:8px;font-size:13px;font-weight:600;color:#ffffff">Confirm Password</label>
<div style="position:relative">
<input class="sp-input" id="pw2" type="{{ pw2Type }}" placeholder="Confirm your password" disabled="{{ isLoading }}" style="width:100%;height:48px;box-sizing:border-box;padding:0 48px 0 16px;border-radius:12px;border:1px solid transparent;background:rgba(255,255,255,0.18);font-size:15px;font-family:inherit;color:#ffffff">
<button class="sp-eye" type="button" aria-label="Show or hide confirm password" onClick="{{ togglePw2 }}" style="position:absolute;right:8px;top:6px;width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:rgba(255,255,255,0.88);cursor:pointer;display:flex;align-items:center;justify-content:center">
<sc-if value="{{ showPw2 }}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
</sc-if>
<sc-if value="{{ hidePw2 }}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4"/><path d="M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
</sc-if>
</button>
</div>
</div>
</sc-if>

<sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}">
<div role="alert" style="display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#fef3f2;border:1px solid #fecdca;color:#b42318;font-size:14px;line-height:1.45">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5v.01"/></svg>
<div>Email or password is incorrect. Check them and try again.</div>
</div>
</sc-if>

<button class="sp-btn" type="button" onClick="{{ submit }}" style="{{ btnStyle }}">
<sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}">
<svg class="sp-spin" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a66c2" stroke-width="3" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9" /></svg>
</sc-if>
<span>{{ btnLabel }}</span>
</button>

</div>

<div style="margin-top:20px;text-align:center;font-size:14px;color:rgba(255,255,255,0.88)">
<span>{{ switchPrompt }}</span>
<button class="sp-link" type="button" onClick="{{ onSwitch }}" style="margin-left:6px;padding:0;border:0;background:transparent;font-size:14px;font-weight:600;font-family:inherit;color:#ffffff;text-decoration:underline;cursor:pointer">{{ switchLabel }}</button>
</div>

</div>
</div>
</div>

<div style="position:relative;width:600px;height:740px;margin:10px 10px 10px 0;border-radius:34px;overflow:hidden;background:linear-gradient(165deg,#8fc0f7 0%,#3b86dc 34%,#0a66c2 58%,#062a5c 100%);flex:none">
<svg aria-hidden="true" width="600" height="740" viewBox="0 0 600 740" style="position:absolute;left:0;top:0">
<defs>
<linearGradient id="rb1" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0.38"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.8"/></linearGradient>
<linearGradient id="rb2" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#9cc8fa" stop-opacity="0"/><stop offset="0.6" stop-color="#9cc8fa" stop-opacity="0.35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.6"/></linearGradient>
<linearGradient id="rb3" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2b7cd6" stop-opacity="0"/><stop offset="0.6" stop-color="#4f93e3" stop-opacity="0.5"/><stop offset="1" stop-color="#cfe4fc" stop-opacity="0.55"/></linearGradient>
<linearGradient id="ln" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.35" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#021028" stop-opacity="0"/><stop offset="1" stop-color="#021028" stop-opacity="0.82"/></linearGradient>
<filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<circle cx="500" cy="170" r="260" fill="url(#glow)" opacity="0.6"/>
<path d="M-40 700 C 90 690 190 560 300 470 S 520 260 650 120 L 650 330 C 540 420 440 560 320 640 S 120 770 -40 800 Z" fill="url(#rb3)"/>
<path d="M-40 640 C 100 620 190 480 310 410 S 520 210 650 70 L 650 250 C 550 350 450 500 330 570 S 110 700 -40 740 Z" fill="url(#rb2)"/>
<path d="M-40 580 C 110 550 200 410 320 350 S 520 170 650 30 L 650 170 C 560 270 460 430 340 500 S 120 630 -40 680 Z" fill="url(#rb1)"/>
<rect x="0" y="420" width="600" height="320" fill="url(#fade)"/>
</svg>

<div style="position:absolute;top:20px;right:20px;width:44px;height:44px;border-radius:22px;background:#ffffff;display:flex;align-items:center;justify-content:center">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24"><polygon points="12,3 21,21 12,21" fill="#0a66c2"/><polygon points="12,3 12,21 3,21" fill="#0a66c2" fill-opacity="0.55"/></svg>
</div>

<div style="position:absolute;left:36px;right:36px;bottom:40px;color:#ffffff;font-size:34px;line-height:1.2;font-weight:300;letter-spacing:-0.01em">
<div>The growth engine for</div>
<div style="font-weight:700">your startup.</div>
</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","default":"signup","options":["login","signup"]},"status":{"editor":"enum","default":"idle","options":["idle","error","loading"]},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const s = this.state || {};
    const mode = s.mode ?? this.props.mode ?? 'signup';
    const status = s.status ?? this.props.status ?? 'idle';
    const isSignup = mode === 'signup';
    const isLogin = !isSignup;
    const isLoading = status === 'loading';
    const isError = status === 'error' && isLogin;
    const showPw = !!s.showPw;
    const showPw2 = !!s.showPw2;
    const inputBase = 'width:100%;height:48px;box-sizing:border-box;border-radius:12px;font-size:15px;font-family:inherit;color:#ffffff;';
    const look = isError ? 'border:1px solid #ffb4ab;background:rgba(255,255,255,0.18);' : 'border:1px solid transparent;background:rgba(255,255,255,0.18);';
    const btnStyle = 'height:48px;border:0;border-radius:12px;background:#ffffff;color:#0a66c2;font-size:15px;font-weight:600;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 26px rgba(6,42,92,0.28);' + (isLoading ? 'opacity:0.85;cursor:progress;' : 'cursor:pointer;');
    const go = (patch) => () => { clearTimeout(this._t); this.setState(patch); };
    return {
      isSignup, isLogin, isLoading, isError, showPw, hidePw: !showPw, showPw2, hidePw2: !showPw2,
      pwType: showPw ? 'text' : 'password',
      pw2Type: showPw2 ? 'text' : 'password',
      title: isSignup ? 'Sign Up' : 'Log In',
      subtitle: isSignup ? 'Create your account to get started' : 'Enter your credentials to get in',
      emailStyle: inputBase + 'padding:0 16px;' + look,
      pwStyle: inputBase + 'padding:0 48px 0 16px;' + look,
      btnStyle,
      btnLabel: isSignup ? (isLoading ? 'Creating account' : 'Create Account') : (isLoading ? 'Logging in' : 'Log In'),
      switchPrompt: isSignup ? 'Already have an account?' : 'Not a member?',
      switchLabel: isSignup ? 'Log in' : 'Create an account',
      onSwitch: go({ mode: isSignup ? 'login' : 'signup', status: 'idle' }),
      togglePw: () => this.setState({ showPw: !showPw }),
      togglePw2: () => this.setState({ showPw2: !showPw2 }),
      submit: () => {
        if (isLoading) return;
        clearTimeout(this._t);
        this.setState({ status: 'loading' });
        this._t = setTimeout(() => this.setState({ status: isSignup ? 'idle' : 'error' }), 1300);
      }
    };
  }
}
</script>
</body>
</html>
